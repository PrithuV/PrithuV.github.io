heading: "Projects"

blurb: "A few things I've built and written up."

# Buttons at the foot of the section. Naming a `social` borrows that platform's
# icon and gives you "View <Name>" for free; add `label:` to say something else.
# Delete the block and no buttons render.
actions:
  - label: "All projects"
    href: "/projects"
  - social: github
    href: "https://github.com/namesarnav"
  - social: huggingface
    href: "https://huggingface.co/namesarnav"

# What the buttons on a project say. Delete a line to fall back to its default.
labels:
  demo: "Try it here"
  code: "Code"
  read_more: "Read more"

# How many rows show before the "View more" button appears.
# Set to 0 to always show everything.
initial_count: 5

items:
  # `slug` is the URL for the detail page: /projects/<slug>. Keep it unique.
  - slug: "marigold"
    title: "Marigold - Turn Lecture Notes to Timed Quizzes and Flashcards"
    description: >
      Upload a PDF of your notes, get flashcards generated from it, study them, then
      take a timed quiz on the same material and see exactly what you missed.
      Re-reading feels like studying; being asked and getting it wrong is what sticks.
    thumbnail: "/projects/marigold.png"     # optional; a neutral panel shows if omitted
    tags: ["React", "FastAPI", "SQLite", "Gemini"]
    links:
      code: "https://github.com/namesarnav/marigold"
      demo: "https://marigold-web-production.up.railway.app/"


## ------------------------------------------------------------------------------------------- ##
  # `slug` is the URL for the detail page: /projects/<slug>. Keep it unique.
  - slug: "mcop"
    title: "Monte Carlo Options Pricer"
    description: >
      A Monte Carlo engine for pricing European and American options. With variance reduction,
      Greeks, and alternative asset dynamics and a backtest that puts its deltas to work
      hedging a real position on ten years of S&P 500 data.
    thumbnail: "/projects/monte-carlo.png"     # optional; a neutral panel shows if omitted
    tags: ["Hedge Funds", "Trading", "Quantitative Research"]
    links:
      code: "https://github.com/namesarnav/mcop"
      # demo: "https://namesarnav.com/demo"

## ------------------------------------------------------------------------------------------- ##
  # `slug` is the URL for the detail page: /projects/<slug>. Keep it unique.
  - slug: "backtest"
    title: "Vectorized Portfolio Backtesting Engine"
    description: >
      A daily-frequency engine for multi-asset equity strategies, built around the
      things that actually decide whether a backtest means anything: vectorised
      computation, explicit look-ahead handling, real transaction costs and honest
      out-of-sample validation. The headline result is negative, which is the point.
    thumbnail: "/projects/backtest.png"     # optional; a neutral panel shows if omitted
    tags: ["Quantitative Research", "Quantitative Trading", "Python"]
    links:
      code: "https://github.com/namesarnav/backtesting-python"
      # demo: "https://namesarnav.com/demo"




## ------------------------------------------------------------------------------------------- ##
  # `slug` is the URL for the detail page: /projects/<slug>. Keep it unique.
  - slug: "trt-ship"
    title: "TRT Ship"
    description: >
      A CLI and Python toolkit that takes a trained Pytorch model through ONNX export, TensorRT engine builds 
      and INT8 calibration, numerical validation and benchmarking, to a Triton model repository


    thumbnail: "/projects/trt-ship.png"     # optional; a neutral panel shows if omitted
    tags: ["PyTorch", "TensorRT", "CUDA"]
    links:
      code: "https://github.com/namesarnav/mcop"
      # demo: "https://namesarnav.com/demo"


  - slug: "synapse"
    title: "Synapse -  A workflow Automation Engine"
    description: >
      Building Synapse: a workflow engine that survives crashes
        You draw a workflow as a graph in the browser, hit publish, and a fleet of workers runs it reliably. If a worker dies halfway through, the work still gets done.


    thumbnail: "/projects/synapse.png"     # optional; a neutral panel shows if omitted
    tags: ["PyTorch", "TensorRT", "CUDA"]
    links:
      code: "https://github.com/namesarnav/mcop"
      demo: "https://web-production-002c6.up.railway.app/"


## ------------------------------------------------------------------------------------------- ##
  # `slug` is the URL for the detail page: /projects/<slug>. Keep it unique.
  - slug: "sv-engine"
    title: "Semantic Video Search Engine"
    description: >
      Point it at a folder of videos and type "a red car driving at night". It returns
      the exact timestamps, ranked across every video you own, each one playable at the
      moment it matched — searching the picture itself, not filenames or transcripts.
    thumbnail: "/projects/sv-engine.png"     # optional; a neutral panel shows if omitted
    tags: ["PyTorch", "CLIP", "CUDA"]
    links:
      code: "https://github.com/namesarnav/semantic-video-search-engine"
      demo: "https://www.loom.com/share/adc1e9a402644b0f9ffeb3c7754e141a"






