  - slug: "polish"
    title: "Polish — a Cursor-like AI Document Editor"
    description: >
      Upload a document in any format, edit it inline with an AI assistant that sees
      the surrounding text, and export back out to PDF, DOCX or LaTeX. Version history
      means an aggressive rewrite is never a one-way door.
    thumbnail: "/projects/polish.png"     # optional; a neutral panel shows if omitted
    tags: ["Next.js", "TypeScript", "Express", "PostgreSQL", "Gemini"]
    links:
      code: "https://github.com/PolishAI-app/polish"
      demo: "https://polish-client-production.up.railway.app/"


