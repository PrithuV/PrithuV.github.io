# Every document worth handing someone: résumé, transcripts, certificate copies.
# Each entry points at a file in public/ (or a full URL). The build fails if the
# file is missing, so a dead link never ships.
#
# `group` is free text — documents are filed under it in the order the groups
# first appear here. Drop the field and the entry sits under no heading.

heading: "Documents"

blurb: "Résumé, transcripts and credential copies, in one place."

items:
  - title: "Résumé"
    group: "Résumé"
    description: >
      Current one-page résumé. The same file the "View Resume" button on the
      homepage opens.
    file: "/documents/resume.pdf"
    kind: "PDF"
    date: "2026-09-23"

