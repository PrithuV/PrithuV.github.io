heading: "Education"

items:
  - institution: "SRM Institute of Technology"
    # The school's mark, from public/. Drop the line and the entry falls back to
    # a monogram in the colour below.
    logo: "/logos/srm-logo.png"
    # The school's own colour, hex only. In dark mode it is lightened
    # automatically so it stays legible; set `color_dark` to override that.
    color: "#034DA1"        # NYU violet
    # Overrides the auto-lightened dark-mode colour.
    color_dark: "#fff"
    # Free text, so "Expected 05/28" and "01/23 – 05/26" both work.
    dates: "Expected July 2027"
    degree: "B.Tech Computer Science and Engineering"
    # `degree` and `field` are joined with a middot when both are present.
    location: "Delhi NCR, India"
    affiliations:
      - "IEEE Computer Society" 
      - "SRM-ACM"
      - " TedxSRM"

    coursework:
      - { name: "Algorithms", grade: "A+" }
      - { name: "Artificial Intelligence", grade: "A+" }
      - { name: "Natural Language Processing", grade: "A+" }
      - { name: "Linear Algebra", grade: "A+" }
      - { name: "Data Structures", grade: "A" }
      - { name: "Operating Systems", grade: "A" }
      - { name: "Database Systems", grade: "A" }
      - { name: "Computer Networks", grade: "A" }
      - { name: "Discrete Mathematics", grade: "A" }
      - { name: "Probability & Statistics", grade: "A" }

